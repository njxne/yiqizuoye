name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify signing keystore
        run: |
          set -euo pipefail
          # The keystore is committed, so every build is signed with the same key. A stable
          # signature is required for the APK to install as an update over the previous build.
          test -f key.jks
          keytool -list -keystore key.jks -storepass kernelsu -alias ksu >/dev/null

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Report min/target SDK
        run: |
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1 || true)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | head -20
          else
            echo "aapt2 not found; skipping"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-android9-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # App 里的「检查更新」读的是 GitHub Releases 的 /releases/latest，
      # 没有 release 就永远是「检查失败」。所以每次 main 构建成功后自动发一个。
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          [ -f "$APK" ] || { echo "找不到 APK"; exit 1; }
          # 与 build.gradle.kts 的 getVersionCode() 保持一致：30000 + 提交数。
          # App 端 UpdateChecker.versionCodeOf(tag) 从 tag 里抠数字比大小，所以 tag 必须就是版本号。
          CODE=$((30000 + $(git rev-list --count HEAD)))
          TAG="v$CODE"
          SIZE=$(stat -c%s "$APK")
          echo "publish tag=$TAG code=$CODE size=$SIZE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在，删掉重建"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          NOTES="build \`$GITHUB_SHA\`

  $TAG · $SIZE bytes

  - 悬浮窗拍题，AI 直接给答案
  - 本地语音朗读，可尝试注入目标 App 的麦克风
  - 答题统计、应用内更新"

          # 建 release 和传资产是两个请求，实测都会偶发 HTTP 500。分开重试，
          # 不然一次 500 就把已经传好的 APK 全废掉、整个 run 标红。
          for i in 1 2 3; do
            if gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "一起作业 $TAG" \
                --notes "$NOTES"; then
              break
            fi
            echo "第 $i 次创建 release 失败，10 秒后重试"
            sleep 10
          done

          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$APK"; then
              echo "release $TAG 发布完成"
              exit 0
            fi
            echo "第 $i 次上传 APK 失败，10 秒后重试"
            sleep 10
          done

          echo "发布 $TAG 失败"
          exit 1

  lint:
    name: Lint API compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon || true

      - name: Dump lint findings
        run: |
          XML=$(find app/build -name "lint-results-debug.xml" | head -1)
          echo "XML=$XML"
          if [ -n "$XML" ]; then
            echo "=== issue ids ==="
            grep -o 'id="[^"]*"' "$XML" | sort | uniq -c | sort -rn
            echo "=== issue tags ==="
            grep -o '<issue [^>]*>' "$XML" | head -300
          else
            echo "no xml report"
          fi

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        with:
          name: lint-android9
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
